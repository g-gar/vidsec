version: 2

# =============================================================================
# MangaDex Catalog Ingestion & Synchronization Pipeline
# Declarative, field-routed analytical pipeline with black-box tasks.
# Memory is a first-class datasource; SQLite is an analytical sink.
# Employs concurrent DAG orchestration, isolated CPU tasks, explicit egress
# network bindings, and zero-copy refcounted memory reclamation (ARCH-017).
# =============================================================================

runtime:
  workers: 4
  scheduler: dag
  routing: type_driven
  max_inflight_bytes: 512MiB
  retain_all: false

datasources:
  # 1. External work items / jobs target datasource (emits jobItems in offline batch CLI runs;
  # in daemon / collector mode, items arrive dynamically via JobEnvelope from collectors)
  tracked_targets:
    driver: yaml_file
    role: source
    path: "${MANGADEX_JOBS_PATH:-./configs/jobs.yaml}"

  # 2. Fast in-memory repository for zero-copy step chaining and RAM coordination
  pipeline_memory:
    driver: memory
    role: duplex

  # 3. Relational sink for long-term catalog caching and offline queries
  catalog_db:
    driver: sqlite
    role: duplex
    path: "${MANGADEX_DB_PATH:-./output/mangadex.db}"
    schema: "${MANGADEX_SCHEMA_PATH:-./configs/schemas.yaml}"

  # 4. Local temporary staging/backup store for compiled .cbz archives
  cbz_staging:
    driver: file_store
    role: sink
    directory: "${CBZ_STAGING_DIR:-./output/cbz/}"

  # 5. Remote SSH/SCP destination for uploading in-memory .cbz archives to Komga host
  komga_remote:
    driver: ssh_store
    role: sink
    host: "${KOMGA_SSH_HOST:-localhost}"
    port: "${KOMGA_SSH_PORT:-22}"
    user: "${KOMGA_SSH_USER:-}"
    identity_file: "${KOMGA_SSH_KEY:-}"
    directory: "${KOMGA_SSH_DIR:-/data/komga}"

networks:
  # Isolated egress virtual network adapter with ACL rules, token-bucket rate limiter,
  # and declarative environment-driven headers (interpolated from .env / host environment).
  # Principle of least privilege: bound ONLY to tasks performing external HTTP calls.
  mangadex_api:
    driver: egress
    headers:
      User-Agent: "${MANGADEX_USER_AGENT:-VidsecMangaDex/3.0.0}"
      Authorization: "${MANGADEX_ACCESS_TOKEN:-}"
    policy:
      block_private_ranges: true
      allow_rules:
        - schemes: [https]
          hosts:
            - "api.mangadex.org"
            - "auth.mangadex.org"
            - "uploads.mangadex.org"
            - "*.mangadex.org"
            - "*.mangadex.network"
          operations: [GET, POST]
    rate_limit:
      requests_per_second: 30
      burst: 60

  # Komga REST API egress adapter (allows local/LAN hosts)
  komga_api:
    driver: egress
    headers:
      X-API-Key: "${KOMGA_API_KEY:-}"
    policy:
      block_private_ranges: false
      allow_rules:
        - schemes: [http, https]
          hosts:
            - "${KOMGA_HOST:-localhost}"
            - "127.0.0.1"
          operations: [GET, POST]

modules:
  manga_catalog:
    path: "./zig-out/lib/libmanga_catalog.so"

pipelines:
  # ===========================================================================
  # MANGA CATALOG SYNCHRONIZATION PIPELINE (Type-Driven Routing)
  #
  # DAG TOPOLOGY (Fork / Fan-Out & Join / Fan-In via Type Signatures):
  #
  #                         [tracked_targets (source)]
  #                                |
  #                       (1. fetch_details)
  #                                |
  #                       (2. fetch_chapters)
  #                           /        \  (Fork / Fan-out)
  #                          /          \
  #                (3. fetch_pages)    (4. generate_comicinfo) [CPU-only]
  #                        |                       |
  #             (5. download_pages) [elemental: 4] |
  #                        |                       |
  #              (6. detect_formats) [CPU-only]    |
  #                     /      \                   |
  #                    /        \                  |
  #        (7. analyze_pages)    \                 |
  #        [elemental: 4, CPU]    \                |
  #                                \               /
  #                                 (8. build_cbz) [Join / Fan-in, CPU-only]
  # ===========================================================================
  manga_sync:
    steps:
      # -----------------------------------------------------------------------
      # STEP 1: Fetch Series Metadata from Inbound Job / tracked_targets
      # Unary filter rejects disabled jobs with zero overhead.
      # -----------------------------------------------------------------------
      - id: fetch_details
        uses: manga_catalog/fetch_series_details
        where: "enabled == true"
        networks:
          - mangadex_api
        outputs:
          series_details:
            datasource: pipeline_memory
          catalog_series:
            datasource: catalog_db

      # -----------------------------------------------------------------------
      # STEP 2: Fetch Chapters List
      # Matches SeriesDetails via canHandle()
      # -----------------------------------------------------------------------
      - id: fetch_chapters
        uses: manga_catalog/fetch_chapters
        networks:
          - mangadex_api
        outputs:
          discovered_chapters:
            datasource: catalog_db

      # -----------------------------------------------------------------------
      # STEP 3: Scrape Chapter Pages
      # Elemental expansion over discovered chapters
      # -----------------------------------------------------------------------
      - id: fetch_pages
        uses: manga_catalog/fetch_chapter_pages
        concurrency: 4
        networks:
          - mangadex_api
        outputs:
          discovered_pages:
            datasource: catalog_db

      # -----------------------------------------------------------------------
      # STEP 4: Generate ComicInfo.xml Metadata (CPU-Only, Runs After Chapters)
      # Requires chapter_number from fetch_chapters; runs parallel to page download
      # -----------------------------------------------------------------------
      - id: generate_comicinfo
        uses: manga_catalog/generate_comicinfo
        params:
          series_title: "${MANGADEX_SERIES_TITLE:-}"
          language: "en"
          manga_type: "YesAndRightToLeft"
        outputs:
          comic_info_xml:
            datasource: pipeline_memory

      # -----------------------------------------------------------------------
      # STEP 5: Download Chapter Pages over HTTP
      # Elemental task processing pages concurrently with token-bucket rate limiter
      # -----------------------------------------------------------------------
      - id: download_pages
        uses: manga_catalog/download_chapter_page
        concurrency: 4
        networks:
          - mangadex_api
        outputs:
          downloaded_pages:
            datasource: pipeline_memory

      # -----------------------------------------------------------------------
      # STEP 6: Magic Bytes Content-Type Detection (CPU-Only, Isolated Network)
      # Elemental task inspecting raw bytes to identify MIME format
      # -----------------------------------------------------------------------
      - id: detect_formats
        uses: manga_catalog/detect_content_type
        concurrency: 4
        outputs:
          pages:
            datasource: pipeline_memory

      # -----------------------------------------------------------------------
      # STEP 7: Simulated Static Image Analysis & Spread Detection (CPU-Only)
      # Elemental task with broadcast parameters configured declaratively
      # -----------------------------------------------------------------------
      - id: analyze_pages
        uses: manga_catalog/analyze_image
        concurrency: 4
        params:
          default_width: 1200
          default_height: 1800
          spread_threshold: 1.3
        outputs:
          analyzed_pages:
            datasource: pipeline_memory

      # -----------------------------------------------------------------------
      # STEP 8: Bundle into Standard .cbz (ZIP) Archive (Packager Join Node)
      # Generates in-memory CBZ and dispatches to `komga_remote` via ssh_store
      # -----------------------------------------------------------------------
      - id: build_cbz
        uses: manga_catalog/build_cbz_archive
        params:
          in_memory: true
          library: "${KOMGA_LIBRARY:-Manga}"
        outputs:
          cbz_backup:
            datasource: cbz_staging
            params:
              remote_dir: "{library}/{series}"
              filename: "{filename}"
          cbz_archive:
            datasource: komga_remote
            retain: true
            params:
              remote_dir: "{library}/{series}"
              filename: "{filename}"

      # -----------------------------------------------------------------------
      # STEP 9: Synchronize Uploaded CBZ Archives with Komga REST API
      # Resolves library, triggers scanLibrary & analyzeSeries, logs egress_history
      # -----------------------------------------------------------------------
      - id: upload_cbz
        uses: manga_catalog/upload_cbz
        networks:
          - komga_api
        params:
          library: "${KOMGA_LIBRARY:-Manga}"
          scan_deep: false
          analyze_series: true
        outputs:
          egress_history:
            datasource: catalog_db
