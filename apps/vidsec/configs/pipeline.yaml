version: 2

# =============================================================================
# VidSec Video Security & Forensics Pipeline (v2)
# Type-driven reactive DAG with bounded verification rounds:
#   - Analysis tasks run by capability & dataflow (`where:` filters).
#   - Any analysis may emit typed remediation/quarantine orders:
#       * TruncateOrder   -> analyzer/apply_truncate
#       * ZeroOutOrder    -> analyzer/apply_zero_out
#       * QuarantineOrder -> quarantine (file_store sink)
#   - After remediation, the sanitized artifact (`requires_reverify == true`)
#     is routed to `pipeline_memory` / `artifacts` for bounded re-verification.
# =============================================================================

runtime:
  workers: auto
  scheduler: dag
  routing: type_driven
  max_inflight_bytes: 512MiB
  retain_all: false

datasources:
  pipeline_memory:
    driver: memory
    role: duplex

  audit_db:
    driver: sqlite
    role: duplex
    path: "${VIDSEC_DB_PATH:-./vidsec_state.db}"
    schema: "${VIDSEC_SCHEMA_PATH:-./configs/schemas.yaml}"

  artifacts:
    driver: file_store
    role: sink
    directory: "./artifacts/"

  quarantine:
    driver: file_store
    role: sink
    directory: "./quarantine/"

modules:
  analyzer:
    path: "./zig-out/lib/libanalyzer.so"

pipelines:
  # ===========================================================================
  # MAIN PIPELINE: Stage 0 -> Format Parsing -> Universal Forensics -> Sanitization
  #
  #    [stream] -> (check_file_size) [0 I/O]
  #                     | [where: size_valid]
  #                (detect_magic) [tika]
  #                 /     |      |       \
  #      (check_ext)  (head_exec) (tail_arch) (mid_entropy)
  #                 \     |      |       /
  #         [where: detected_family == isobmff | ebml | riff]
  #            /          |          \
  #      (MP4 tasks)  (MKV tasks)  (RIFF tasks)
  #            \          |          /
  #        (analyze_topology) + (scan_entropy)
  #            |          |          |
  #            v          v          v
  #    [TruncateOrder] [ZeroOutOrder] [QuarantineOrder]
  #            |          |          |
  #     (apply_truncate)(apply_zero_out) -> (quarantine sink)
  #            \          /
  #      [requires_reverify] -> next verification round
  # ===========================================================================
  main:
    steps:
      # -----------------------------------------------------------------------
      # STAGE 0: Atomic Pre-Triage
      # -----------------------------------------------------------------------
      - id: stage0_size
        uses: analyzer/check_file_size
        params:
          min_file_size_bytes: 8
          max_file_size_mb: 4096
        outputs:
          size_check:
            datasource: pipeline_memory

      - id: stage0_magic
        uses: analyzer/detect_magic
        where: "size_valid == true"
        outputs:
          magic_info:
            datasource: pipeline_memory

      - id: stage0_ext
        uses: analyzer/check_extension
        where: "is_video == true and is_hostile == false"
        params:
          strict_extension: true
        outputs:
          extension_check:
            datasource: pipeline_memory

      - id: stage0_head_exec
        uses: analyzer/scan_head_executables
        where: "size_valid == true"
        outputs:
          head_exec_scan:
            datasource: pipeline_memory

      - id: stage0_tail_arch
        uses: analyzer/scan_tail_archives
        where: "size_valid == true"
        outputs:
          tail_arch_scan:
            datasource: pipeline_memory

      - id: stage0_mid_entropy
        uses: analyzer/measure_mid_entropy
        where: "size_valid == true"
        params:
          min_mid_entropy: 5.5
        outputs:
          mid_entropy_stats:
            datasource: pipeline_memory

      # -----------------------------------------------------------------------
      # STAGE 1: Format-Specific Container Parsing & Lowering to `media_ir`
      # -----------------------------------------------------------------------
      - id: lower_mp4
        uses: analyzer/lower_mp4_container
        where: "detected_family == 'isobmff' and is_video == true and is_hostile == false"
        outputs:
          container_metadata:
            datasource: audit_db
          ir_regions:
            datasource: pipeline_memory
          audit_findings:
            datasource: audit_db

      - id: lower_mkv
        uses: analyzer/lower_ebml_container
        where: "detected_family == 'ebml' and is_video == true and is_hostile == false"
        outputs:
          container_metadata:
            datasource: audit_db
          ir_regions:
            datasource: pipeline_memory
          audit_findings:
            datasource: audit_db

      - id: lower_riff
        uses: analyzer/lower_riff_container
        where: "detected_family == 'riff' and is_video == true and is_hostile == false"
        outputs:
          container_metadata:
            datasource: audit_db
          ir_regions:
            datasource: pipeline_memory
          audit_findings:
            datasource: audit_db

      - id: inspect_mp4
        uses: analyzer/inspect_mp4_container
        where: "detected_family == 'isobmff' and is_video == true and is_hostile == false"
        outputs:
          mp4_summary:
            datasource: audit_db
          audit_findings:
            datasource: audit_db

      - id: inspect_mkv
        uses: analyzer/inspect_ebml_container
        where: "detected_family == 'ebml' and is_video == true and is_hostile == false"
        outputs:
          mkv_summary:
            datasource: audit_db
          audit_findings:
            datasource: audit_db

      - id: inspect_riff
        uses: analyzer/inspect_riff_container
        where: "detected_family == 'riff' and is_video == true and is_hostile == false"
        outputs:
          riff_summary:
            datasource: audit_db
          audit_findings:
            datasource: audit_db

      # -----------------------------------------------------------------------
      # STAGE 2: Universal IR & Forensic Analysis
      # -----------------------------------------------------------------------
      - id: analyze_topology
        uses: analyzer/analyze_topology
        params:
          allow_trailing_slack: false
          max_trailing_slack_bytes: 0
        outputs:
          audit_findings:
            datasource: audit_db
          truncate_orders:
            datasource: pipeline_memory

      - id: scan_entropy
        uses: analyzer/scan_entropy
        concurrency: max
        params:
          min_entropy: 7.2
        outputs:
          audit_findings:
            datasource: audit_db
          zero_out_orders:
            datasource: pipeline_memory
          quarantine_orders:
            datasource: quarantine

      # -----------------------------------------------------------------------
      # SANITIZATION SUBSCRIBERS (Pub/Sub via Typed Orders)
      # Any analysis step above can emit TruncateOrder or ZeroOutOrder.
      # -----------------------------------------------------------------------
      - id: sanitize_truncate
        uses: analyzer/apply_truncate
        params:
          max_in_memory_bytes: 67108864
        outputs:
          remediation_outcomes:
            datasource: audit_db

      - id: sanitize_zero_out
        uses: analyzer/apply_zero_out
        params:
          max_in_memory_bytes: 67108864
        outputs:
          remediation_outcomes:
            datasource: audit_db
