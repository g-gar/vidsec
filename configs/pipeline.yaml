version: 2

# =============================================================================
# VidSec Video Security & Forensics Pipeline (Next-Gen Architecture)
# Declarative, field-routed analytical pipeline with black-box tasks.
# Memory is a first-class datasource; SQLite is an opt-in analytical sink.
# =============================================================================

# =============================================================================
# RUNTIME & THREAD BUDGET
# =============================================================================
runtime:
  workers: auto # "auto" detects host CPU cores; set to 1 for single-threaded deterministic debugging

datasources:
  # High-speed in-memory repository for zero-copy step chaining & router coordination
  pipeline_memory:
    type: memory

  # Relational sink for long-term audit trail and security reports
  audit_db:
    type: sqlite
    path: "${VIDSEC_DB_PATH:-./vidsec_state.db}"

  # Physical artifact directory for forensic extractions or quarantined files
  artifacts:
    type: file_store
    directory: "./artifacts/"

modules:
  analyzer:
    path: "./zig-out/lib/libanalyzer.so"

# =============================================================================
# PIPELINE DEFINITION
# =============================================================================
pipelines:
  # ===========================================================================
  # STAGE 0: Pre-Triage Gatekeeper
  # Validates magic bytes, container entropy, and file dimensions.
  # Emits formal triage record to SQLite and lightweight coordination flags to RAM.
  # ===========================================================================
  main:
    steps:
      - id: stage0_probe_file
        uses: analyzer/probe_file
        params:
          min_file_size_bytes: 8
          max_file_size_mb: 4096
          min_mid_entropy: 5.5
          strict_extension: true
        outputs:
          # Canal 1: Registro formal a SQLite usando el catálogo central
          triage_record:
            from: result
            schema: components/schemas/file_triage
            datasource: audit_db

          # Canal 2: Control de flujo enriquecido e inline en memoria para routers
          coordination:
            datasource: pipeline_memory
            schema:
              detected_family: text
              true_magic_kind: int64
              exceeds_size_limit: bool
              verdict:
                type: text
                from: verdict
              should_quarantine:
                type: bool
                from: "verdict == 'DROP' or true_magic_kind >= 10 or exceeds_size_limit == true"

      # Router ultra-rápido en RAM: evalúa variables directamente sin hacer SELECT
      - router: dispatch_after_triage
        cases:
          - when: "stage0_probe_file.coordination.should_quarantine"
            goto: quarantine_flow
          - when: "stage0_probe_file.coordination.detected_family == 'isobmff'"
            goto: mp4_pipeline
          - when: "stage0_probe_file.coordination.detected_family == 'ebml'"
            goto: mkv_pipeline
          - when: "stage0_probe_file.coordination.detected_family == 'riff'"
            goto: riff_pipeline
        default: unsupported_format_flow

  # ===========================================================================
  # MP4 / ISOBMFF PIPELINE: Triage Específico de Formato + Lowering a IR
  # ===========================================================================
  mp4_pipeline:
    steps:
      # -----------------------------------------------------------------------
      # PASO 1: Triage Semántico Rápido de MP4
      # Valida marcas (ftyp), tracks, dimensiones y codecs antes del lowering pesado.
      # -----------------------------------------------------------------------
      - id: probe_mp4
        uses: analyzer/probe_mp4
        inputs:
          stream: file
          file_size: stage0_probe_file.coordination.file_size
        outputs:
          triage_record:
            from: result
            schema: components/schemas/mp4_triage
            datasource: audit_db

          coordination:
            datasource: pipeline_memory
            schema:
              track_count: int64
              video_codec: text
              verdict: text
              should_drop:
                type: bool
                from: "verdict == 'DROP'"

      - router: dispatch_after_mp4_triage
        cases:
          - when: "probe_mp4.coordination.should_drop"
            goto: quarantine_flow
        default: continue

      # -----------------------------------------------------------------------
      # PASO 2: Lowering Directo a IR (Black Box)
      # Entrada: Archivo -> Salida: { metadata, regions, findings }
      # -----------------------------------------------------------------------
      - id: lower_mp4
        uses: analyzer/lower_mp4_container
        inputs:
          stream: file
        outputs:
          # Metadatos del contenedor a SQLite
          metadata:
            from: container_metadata
            schema: components/schemas/container_metadata
            datasource: audit_db

          # Árbol de regiones (50.000 cajas): se queda en RAM como slice tipado
          regions:
            from: regions
            schema: components/schemas/ir_regions
            datasource: pipeline_memory

          # Hallazgos de seguridad detectados durante el parsing (overflows, slack)
          findings:
            from: findings
            schema: components/schemas/audit_findings
            datasource: audit_db

          # Resumen inline en RAM para que el router decida sin consultas SQL
          gate_control:
            datasource: pipeline_memory
            schema:
              critical_count:
                type: int64
                from: "count(findings, severity >= 2)"
              has_overflows:
                type: bool
                from: "count(findings, rule_id == 'IR_REGION_OVERFLOW') > 0"

      - router: dispatch_after_mp4_lowering
        cases:
          - when: "lower_mp4.gate_control.critical_count > 0 or lower_mp4.gate_control.has_overflows"
            goto: quarantine_flow
        default: forensics_analysis_pipeline

  # ===========================================================================
  # EBML / MKV PIPELINE: Triage Específico de Formato + Lowering a IR
  # ===========================================================================
  mkv_pipeline:
    steps:
      - id: probe_mkv
        uses: analyzer/probe_mkv
        inputs:
          stream: file
          file_size: stage0_probe_file.coordination.file_size
        outputs:
          triage_record:
            from: result
            schema: components/schemas/mkv_triage
            datasource: audit_db

          coordination:
            datasource: pipeline_memory
            schema:
              verdict: text
              should_drop:
                type: bool
                from: "verdict == 'DROP'"

      - router: dispatch_after_mkv_triage
        cases:
          - when: "probe_mkv.coordination.should_drop"
            goto: quarantine_flow
        default: continue

      - id: lower_mkv
        uses: analyzer/lower_ebml_container
        inputs:
          stream: file
        outputs:
          metadata:
            from: container_metadata
            schema: components/schemas/container_metadata
            datasource: audit_db

          regions:
            from: elements
            schema: components/schemas/ir_regions
            datasource: pipeline_memory

          findings:
            from: findings
            schema: components/schemas/audit_findings
            datasource: audit_db

          gate_control:
            datasource: pipeline_memory
            schema:
              critical_count:
                type: int64
                from: "count(findings, severity >= 2)"

      - router: dispatch_after_mkv_lowering
        cases:
          - when: "lower_mkv.gate_control.critical_count > 0"
            goto: quarantine_flow
        default: forensics_analysis_pipeline

  # ===========================================================================
  # RIFF / AVI PIPELINE: Triage Específico de Formato + Lowering a IR
  # ===========================================================================
  riff_pipeline:
    steps:
      - id: probe_riff
        uses: analyzer/probe_riff
        inputs:
          stream: file
          file_size: stage0_probe_file.coordination.file_size
        outputs:
          triage_record:
            from: result
            schema: components/schemas/riff_triage
            datasource: audit_db

          coordination:
            datasource: pipeline_memory
            schema:
              verdict: text
              should_drop:
                type: bool
                from: "verdict == 'DROP'"

      - router: dispatch_after_riff_triage
        cases:
          - when: "probe_riff.coordination.should_drop"
            goto: quarantine_flow
        default: continue

      - id: lower_riff
        uses: analyzer/lower_riff_container
        inputs:
          stream: file
        outputs:
          metadata:
            from: container_metadata
            schema: components/schemas/container_metadata
            datasource: audit_db

          regions:
            from: chunks
            schema: components/schemas/ir_regions
            datasource: pipeline_memory

          findings:
            from: findings
            schema: components/schemas/audit_findings
            datasource: audit_db

          gate_control:
            datasource: pipeline_memory
            schema:
              critical_count:
                type: int64
                from: "count(findings, severity >= 2)"

      - router: dispatch_after_riff_lowering
        cases:
          - when: "lower_riff.gate_control.critical_count > 0"
            goto: quarantine_flow
        default: forensics_analysis_pipeline

  # ===========================================================================
  # STAGE 3: Deep Forensic Analysis & Security Audit Pipeline
  # Consume las 'regions' directamente desde RAM sin pasar por BBDD.
  # ===========================================================================
  forensics_analysis_pipeline:
    steps:
      # Analiza solapamientos y huecos en la topología recibida en memoria
      - id: analyze_topology
        uses: analyzer/analyze_topology
        inputs:
          # Enlaza directamente con el slice de regiones en RAM de la tarea anterior
          regions: lower_mp4.regions
        params:
          allow_trailing_slack: false
          max_trailing_slack_bytes: 0
        outputs:
          findings:
            from: findings
            schema: components/schemas/audit_findings
            datasource: audit_db

      # Escaneo de entropía sobre el slack detectado
      - id: scan_entropy
        uses: analyzer/scan_entropy
        concurrency: max # Burst a todos los núcleos disponibles para computación intensiva de Shannon entropy
        inputs:
          stream: file
          regions: lower_mp4.regions
        params:
          min_entropy: 7.2
        outputs:
          findings:
            from: findings
            schema: components/schemas/audit_findings
            datasource: audit_db

          coordination:
            datasource: pipeline_memory
            schema:
              anomalous_entropy_detected:
                type: bool
                from: "count(findings, severity >= 2) > 0"

      - router: dispatch_after_forensics
        cases:
          - when: "scan_entropy.coordination.anomalous_entropy_detected"
            goto: forensics_findings_detected
        default: video_verified_clean

  # ===========================================================================
  # TERMINAL FLOWS
  # ===========================================================================
  forensics_findings_detected:
    steps: []

  video_verified_clean:
    steps: []

  unsupported_format_flow:
    steps:
      - id: mark_unsupported
        uses: analyzer/record_finding
        params:
          rule_id: "STAGE1_UNSUPPORTED_FORMAT"
          severity: 1
          message: "Format family not supported for deep analysis"
        outputs:
          findings:
            schema: components/schemas/audit_findings
            datasource: audit_db

  quarantine_flow:
    steps:
      - id: mark_quarantined
        uses: analyzer/record_finding
        params:
          rule_id: "STAGE0_QUARANTINED"
          severity: 2
          message: "File rejected during initial triage"
        outputs:
          findings:
            schema: components/schemas/audit_findings
            datasource: audit_db

# =============================================================================
# COMPONENTS (Catálogo Central de Esquemas Canónicos)
# Define la estructura de persistencia relacional para datasources estructurados.
# =============================================================================
components:
  schemas:
    file_triage:
      primary_key: id
      columns:
        id:                 { type: int64, pk: true }
        file_size:          { type: int64 }
        detected_family:    { type: text }
        true_magic_kind:    { type: int64 }
        true_magic_name:    { type: text }
        exceeds_size_limit: { type: bool, default: false }
        verdict:            { type: text }
        identified_format:  { type: text, default: "unknown" }
        mime_type:          { type: text, default: "application/octet-stream" }
        mid_entropy:        { type: float64, default: 0.0 }
        flags_csv:          { type: text, default: "" }

    mp4_triage:
      primary_key: id
      columns:
        id:                      { type: int64, pk: true }
        track_count:             { type: int64 }
        video_track_count:       { type: int64 }
        audio_track_count:       { type: int64 }
        major_brand:             { type: text }
        video_codec:             { type: text }
        video_width:             { type: int64 }
        video_height:            { type: int64 }
        total_samples:           { type: int64 }
        total_sample_bytes:      { type: int64 }
        unreferenced_mdat_slack: { type: int64 }
        verdict:                 { type: text }
        flags_csv:               { type: text, default: "" }

    mkv_triage:
      primary_key: id
      columns:
        id:                         { type: int64, pk: true }
        track_count:                { type: int64 }
        video_track_count:          { type: int64 }
        audio_track_count:          { type: int64 }
        video_codec_id:             { type: text }
        video_width:                { type: int64 }
        video_height:               { type: int64 }
        duration_seconds:           { type: float64 }
        cluster_count:              { type: int64 }
        unreferenced_cluster_slack: { type: int64 }
        verdict:                    { type: text }
        flags_csv:                  { type: text, default: "" }

    riff_triage:
      primary_key: id
      columns:
        id:                   { type: int64, pk: true }
        chunk_count:          { type: int64 }
        form_type:            { type: text }
        root_size:            { type: int64 }
        movi_bytes:           { type: int64 }
        junk_bytes:           { type: int64 }
        trailing_slack_bytes: { type: int64 }
        verdict:              { type: text }
        flags_csv:            { type: text, default: "" }

    container_metadata:
      primary_key: id
      columns:
        id:               { type: int64, pk: true }
        file_size:        { type: int64 }
        detected_format:  { type: text }
        true_magic_name:  { type: text }
        highest_root_end: { type: int64 }

    ir_regions:
      primary_key: [container_id, region_id]
      columns:
        container_id:             { type: int64 }
        region_id:                { type: int64 }
        parent_region_id:         { type: int64, nullable: true }
        tag_name:                 { type: text }
        role:                     { type: text }
        header_offset:            { type: int64 }
        payload_offset:           { type: int64 }
        effective_end_offset:     { type: int64 }
        is_truncated_or_overflow: { type: bool, default: false }
      indexes:
        - columns: [role]
        - columns: [tag_name]

    audit_findings:
      primary_key: finding_id
      columns:
        finding_id:         { type: int64, pk: true }
        rule_id:            { type: text }
        severity:           { type: int64 }
        file_offset:        { type: int64 }
        byte_length:        { type: int64, default: 0 }
        end_offset:         { type: int64, default: 0 }
        region_tag:         { type: text, nullable: true }
        measured_value:     { type: float64, nullable: true }
        message:            { type: text, nullable: true }
        is_remediated:      { type: bool, default: false }
        remediation_action: { type: text, default: "UNRESOLVED" }
      indexes:
        - columns: [rule_id]
        - columns: [severity]
