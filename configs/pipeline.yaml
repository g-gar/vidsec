version: 2

# =============================================================================
# VidSec Video Security & Forensics Pipeline
# Declarative, in-memory, field-routed analytical pipeline configuration.
# =============================================================================

storages:
  db:
    type: sqlite
    schema: "./configs/schemas.yaml"
    path: "./vidsec_state.db"
  artifacts:
    type: file_store
    directory: "./artifacts/"

modules:
  analyzer:
    path: "./zig-out/lib/libanalyzer.so"

pipelines:
  # ===========================================================================
  # STAGE 0: Pre-Triage Gatekeeper
  # Validates magic bytes, container entropy, and file dimensions.
  # Persists initial triage metadata to SQLite; intermediate buffers remain in RAM.
  # ===========================================================================
  main:
    steps:
      - id: stage0_probe_file
        uses: analyzer/probe_file
        input:
          stream:
            from: file
        params:
          min_file_size_bytes: 8
          max_file_size_mb: 4096
          min_mid_entropy: 5.5
          strict_extension: true
        persist:
          db: file_triage

      - router: dispatch_after_triage
        cases:
          - when: "stage0_probe_file.verdict == 'DROP' or stage0_probe_file.true_magic_kind >= 10 or stage0_probe_file.exceeds_size_limit == true"
            goto: quarantine_flow
        default: stage1_container_ready

  # ===========================================================================
  # STAGE 1: Format-Specific Container Inspection & Semantic Triaging
  # ===========================================================================
  stage1_container_ready:
    steps:
      - id: log_triage_pass
        uses: sql_rule
        query: |
          SELECT 'STAGE0_VERIFIED' AS rule_id,
                 0 AS severity,
                 0 AS file_offset,
                 detected_family AS region_tag,
                 mid_entropy AS measured_value,
                 'Passed Stage 0 triage as ' || identified_format || ' (' || mime_type || ')' AS message
          FROM file_triage
        persist:
          db: audit_findings

      - router: dispatch_to_format_triage
        cases:
          - when: "stage0_probe_file.detected_family == 'isobmff'"
            goto: isobmff_triage_pipeline
          - when: "stage0_probe_file.detected_family == 'ebml'"
            goto: ebml_triage_pipeline
          - when: "stage0_probe_file.detected_family == 'riff'"
            goto: riff_triage_pipeline
        default: unsupported_format_flow

  # Stage 1: ISOBMFF Structural Triaging Pipeline
  isobmff_triage_pipeline:
    steps:
      - id: isobmff_probe_and_expand
        uses: analyzer/probe_isobmff
        input:
          stream:
            from: file
        params:
          emit_boxes: true
          allow_gaps: false
          max_gap_tolerance_bytes: 0
          allow_trailing_data: false
          max_depth: 8
          strict_order: true
        persist:
          db: isobmff_triage

      - router: dispatch_after_isobmff_triage
        cases:
          - when: "isobmff_probe_and_expand.verdict == 'DROP'"
            goto: quarantine_flow
        default: isobmff_verified_flow

  isobmff_verified_flow:
    steps:
      - id: log_isobmff_triage_pass
        uses: sql_rule
        query: |
          SELECT 'STAGE1_ISOBMFF_VERIFIED' AS rule_id,
                 0 AS severity,
                 0 AS file_offset,
                 'isobmff' AS region_tag,
                 CAST(box_count AS REAL) AS measured_value,
                 'Passed ISOBMFF structural triage: ' || box_count || ' boxes, ' || mdat_count || ' mdat (' || total_mdat_bytes || ' bytes)' AS message
          FROM isobmff_triage
        persist:
          db: audit_findings

      - router: dispatch_to_mp4_triage
        cases: []
        default: mp4_triage_pipeline

  # Stage 1: MP4 Semantic Triaging Pipeline
  mp4_triage_pipeline:
    steps:
      - id: mp4_probe_and_triage
        uses: analyzer/probe_mp4
        input:
          stream:
            from: file
        inputs:
          file_size: stage0_probe_file.file_size
          isobmff_box_count:
            from: isobmff_probe_and_expand.box_count
            default: 0
        params:
          emit_tracks: true
        persist:
          db: mp4_triage

      - router: dispatch_after_mp4_triage
        cases:
          - when: "mp4_probe_and_triage.verdict == 'DROP'"
            goto: quarantine_flow
        default: mp4_verified_flow

  mp4_verified_flow:
    steps:
      - id: log_mp4_triage_pass
        uses: sql_rule
        query: |
          SELECT 'STAGE1_MP4_VERIFIED' AS rule_id,
                 0 AS severity,
                 0 AS file_offset,
                 'mp4' AS region_tag,
                 CAST(track_count AS REAL) AS measured_value,
                 'Passed MP4 triage: ' || track_count || ' tracks (' || video_track_count || ' video, ' || audio_track_count || ' audio), brand=' || major_brand || ', unreferenced slack=' || unreferenced_mdat_slack || ' bytes' AS message
          FROM mp4_triage
        persist:
          db: audit_findings

      - router: dispatch_to_ir_from_mp4
        cases: []
        default: ir_lowering_pipeline

  # Stage 1: EBML Structural Triaging Pipeline
  ebml_triage_pipeline:
    steps:
      - id: ebml_probe_and_expand
        uses: analyzer/probe_ebml
        input:
          stream:
            from: file
        params:
          emit_elements: true
          recurse_clusters: false
        persist:
          db: ebml_triage

      - router: dispatch_after_ebml_triage
        cases:
          - when: "ebml_probe_and_expand.verdict == 'DROP'"
            goto: quarantine_flow
        default: ebml_verified_flow

  ebml_verified_flow:
    steps:
      - id: log_ebml_triage_pass
        uses: sql_rule
        query: |
          SELECT 'STAGE1_EBML_VERIFIED' AS rule_id,
                 0 AS severity,
                 0 AS file_offset,
                 'ebml' AS region_tag,
                 CAST(element_count AS REAL) AS measured_value,
                 'Passed EBML structural triage: ' || element_count || ' elements, doctype=' || doc_type || ' v' || doc_type_version || ', ' || cluster_count || ' clusters (' || total_cluster_bytes || ' bytes)' AS message
          FROM ebml_triage
        persist:
          db: audit_findings

      - router: dispatch_to_mkv_triage
        cases: []
        default: mkv_triage_pipeline

  # Stage 1: MKV Semantic Triaging Pipeline
  mkv_triage_pipeline:
    steps:
      - id: mkv_probe_and_triage
        uses: analyzer/probe_mkv
        input:
          stream:
            from: file
        inputs:
          file_size: stage0_probe_file.file_size
        params:
          emit_tracks: true
        persist:
          db: mkv_triage

      - router: dispatch_after_mkv_triage
        cases:
          - when: "mkv_probe_and_triage.verdict == 'DROP'"
            goto: quarantine_flow
        default: mkv_verified_flow

  mkv_verified_flow:
    steps:
      - id: log_mkv_triage_pass
        uses: sql_rule
        query: |
          SELECT 'STAGE1_MKV_VERIFIED' AS rule_id,
                 0 AS severity,
                 0 AS file_offset,
                 'mkv' AS region_tag,
                 CAST(track_count AS REAL) AS measured_value,
                 'Passed MKV triage: ' || track_count || ' tracks (' || video_track_count || ' video, ' || audio_track_count || ' audio), codec=' || primary_video_codec || ', ' || video_width || 'x' || video_height || ', duration=' || ROUND(duration_seconds, 2) || 's' AS message
          FROM mkv_triage
        persist:
          db: audit_findings

      - router: dispatch_to_ir_from_mkv
        cases: []
        default: ir_lowering_pipeline

  # Stage 1: RIFF Structural Triaging Pipeline
  riff_triage_pipeline:
    steps:
      - id: riff_probe_and_expand
        uses: analyzer/probe_riff
        input:
          stream:
            from: file
        params:
          emit_chunks: true
          recurse_movi: false
        persist:
          db: riff_triage

      - router: dispatch_after_riff_triage
        cases:
          - when: "riff_probe_and_expand.verdict == 'DROP'"
            goto: quarantine_flow
        default: riff_verified_flow

  riff_verified_flow:
    steps:
      - id: log_riff_triage_pass
        uses: sql_rule
        query: |
          SELECT 'STAGE1_RIFF_VERIFIED' AS rule_id,
                 0 AS severity,
                 0 AS file_offset,
                 'riff' AS region_tag,
                 CAST(chunk_count AS REAL) AS measured_value,
                 'Passed RIFF structural triage: ' || chunk_count || ' chunks, form=' || form_type || ', root_size=' || root_size || ', movi=' || movi_bytes || ' bytes' AS message
          FROM riff_triage
        persist:
          db: audit_findings

      - router: dispatch_to_ir_from_riff
        cases: []
        default: ir_lowering_pipeline

  # ===========================================================================
  # STAGE 2: Intermediate Representation (IR) Lowering Pipeline
  # Zero-SQL flow: intermediate regions, extents, and configs stay in RAM.
  # Only the consolidated container_metadata is persisted to SQLite.
  # ===========================================================================
  ir_lowering_pipeline:
    steps:
      - id: lower_container_to_ir
        uses: analyzer/lower_container
        input:
          stream:
            from: file
          boxes:
            table: isobmff_boxes
          elements:
            table: ebml_elements
          chunks:
            table: riff_chunks
        inputs:
          file_size: stage0_probe_file.file_size
          detected_family: stage0_probe_file.detected_family
          true_magic_kind: stage0_probe_file.true_magic_kind
          true_magic_name: stage0_probe_file.true_magic_name
        persist:
          db: container_metadata

      - id: lower_media_to_ir
        uses: analyzer/lower_media
        inputs:
          detected_family: stage0_probe_file.detected_family
        input:
          mp4_tracks:
            table: mp4_tracks
          mkv_tracks:
            table: mkv_tracks
        # Pure in-memory: no persist declaration keeps codec configs and sample extents in RAM

      - router: dispatch_after_ir_lowering
        cases:
          - when: "SELECT 1 FROM audit_findings WHERE rule_id = 'IR_REGION_OVERFLOW' OR severity >= 2"
            goto: quarantine_flow
        default: ir_verified_flow

  ir_verified_flow:
    steps:
      - id: log_ir_lowered
        uses: sql_rule
        query: |
          SELECT 'IR_LOWERED' AS rule_id,
                 0 AS severity,
                 0 AS file_offset,
                 true_magic_name AS region_tag,
                 0.0 AS measured_value,
                 'Consolidated IR container: file_size=' || file_size || ', highest_root_end=' || highest_root_end AS message,
                 1 AS is_remediated,
                 'VERIFIED' AS remediation_action
          FROM container_metadata
        persist:
          db: audit_findings

      - router: dispatch_to_forensics
        cases: []
        default: forensics_analysis_pipeline

  # ===========================================================================
  # STAGE 3: Deep Forensic Analysis & Security Audit Pipeline
  # Reads topology, entropy, and codec structures from memory and registers findings.
  # ===========================================================================
  forensics_analysis_pipeline:
    steps:
      - id: analyze_topology
        uses: analyzer/analyze_topology
        input:
          stream:
            from: file
          regions:
            table: ir_regions
        inputs:
          file_size: stage0_probe_file.file_size
          highest_root_end: lower_container_to_ir.highest_root_end
          prev_verdict: db.file_triage.verdict
        params:
          allow_trailing_slack: false
          max_trailing_slack_bytes: 0
        persist:
          db: audit_findings

      - id: scan_entropy
        uses: analyzer/scan_entropy
        input:
          stream:
            from: file
          slack:
            table: ir_unreferenced_slack
        inputs:
          file_size: stage0_probe_file.file_size
        params:
          min_entropy: 7.2
        persist:
          db: audit_findings

      - id: check_inconsistencies
        uses: analyzer/check_inconsistencies
        input:
          stream:
            from: file
          configs:
            table: ir_codec_configs
          extents:
            table: ir_sample_extents
        persist:
          db: audit_findings

      - router: dispatch_after_forensics
        cases:
          - when: "SELECT 1 FROM audit_findings WHERE severity >= 2"
            goto: forensics_findings_detected
        default: video_verified_clean

  # ===========================================================================
  # Final Terminal Flows
  # ===========================================================================
  forensics_findings_detected:
    steps:
      - id: log_forensics_summary
        uses: sql_rule
        query: |
          SELECT 'FORENSICS_FINDINGS_DETECTED' AS rule_id,
                 2 AS severity,
                 0 AS file_offset,
                 'forensics' AS region_tag,
                 CAST((SELECT COUNT(*) FROM audit_findings WHERE severity >= 2) AS REAL) AS measured_value,
                 'Forensic scan completed: ' || (SELECT COUNT(*) FROM audit_findings WHERE severity >= 2) || ' critical finding(s) detected' AS message,
                 0 AS is_remediated,
                 'THREAT_DETECTED' AS remediation_action
        persist:
          db: audit_findings

  video_verified_clean:
    steps:
      - id: log_clean_certification
        uses: sql_rule
        query: |
          SELECT 'VIDEO_CLEAN_VERIFIED' AS rule_id,
                 0 AS severity,
                 0 AS file_offset,
                 'verified' AS region_tag,
                 0.0 AS measured_value,
                 'Video certified clean: zero critical unresolved findings across all stages' AS message,
                 1 AS is_remediated,
                 'VERIFIED_CLEAN' AS remediation_action
        persist:
          db: audit_findings

  unsupported_format_flow:
    steps:
      - id: log_unsupported_format
        uses: sql_rule
        query: |
          SELECT 'STAGE1_UNSUPPORTED_FORMAT' AS rule_id,
                 1 AS severity,
                 0 AS file_offset,
                 detected_family AS region_tag,
                 0.0 AS measured_value,
                 'Format family not supported for deep triage: ' || detected_family AS message
          FROM file_triage
        persist:
          db: audit_findings

  quarantine_flow:
    steps:
      - id: mark_quarantine_decision
        uses: sql_rule
        query: |
          SELECT 'STAGE0_QUARANTINED' AS rule_id,
                 2 AS severity,
                 0 AS file_offset,
                 identified_format AS region_tag,
                 mid_entropy AS measured_value,
                 'File rejected at Stage 0 Triage (' || flags_csv || ')' AS message
          FROM file_triage
        persist:
          db: audit_findings
