version: 2

engine:
  schemas: "./configs/schemas.yaml"
  db_mode: wal_file
  db_path: "./vidsec_state.db"
  db_busy_timeout_ms: 5000
  max_task_memory_mb: 256

modules:
  triage:
    path: "./zig-out/lib/libtriage.so"
  ir:
    path: "./zig-out/lib/libir.so"
  forensics:
    path: "./zig-out/lib/libforensics.so"

pipelines:
  # ===========================================================================
  # STAGE 0: Lightweight Pre-Triage Gatekeeper (libtriage.so -> SQLite file_triage)
  # ===========================================================================
  main:
    steps:
      - task: stage0_probe_file
        use: triage/probe_file
        input:
          stream:
            from: file
        params:
          min_file_size_bytes: 8
          max_file_size_mb: 4096
          min_mid_entropy: 5.5
          strict_extension: true
        output:
          into: file_triage

      - router: dispatch_after_triage
        cases:
          - when: "SELECT 1 FROM file_triage WHERE verdict = 'DROP' OR true_magic_kind >= 10 OR exceeds_size_limit = 1"
            goto: quarantine_flow
        default: stage1_container_ready

  # ===========================================================================
  # STAGE 1: Downstream Container & Mitigation Flows
  # ===========================================================================
  stage1_container_ready:
    steps:
      - task: log_triage_pass
        use: sql_rule
        query: |
          SELECT 'STAGE0_VERIFIED' AS rule_id,
                 0 AS severity,
                 0 AS file_offset,
                 detected_family AS region_tag,
                 mid_entropy AS measured_value,
                 'Passed Stage 0 triage as ' || identified_format || ' (' || mime_type || ')' AS message
          FROM file_triage
        output:
          into: audit_findings

      - router: dispatch_to_format_triage
        cases:
          - when: "SELECT 1 FROM file_triage WHERE detected_family = 'isobmff'"
            goto: isobmff_triage_pipeline
          - when: "SELECT 1 FROM file_triage WHERE detected_family = 'ebml'"
            goto: ebml_triage_pipeline
          - when: "SELECT 1 FROM file_triage WHERE detected_family = 'riff'"
            goto: riff_triage_pipeline
        default: unsupported_format_flow

  # Stage 1: Dedicated Native ISOBMFF Structural Triaging Pipeline
  isobmff_triage_pipeline:
    steps:
      - task: isobmff_probe_and_expand
        use: triage/probe_isobmff
        input:
          stream:
            from: file
        params:
          emit_boxes: true
        output:
          schema: triage

      - router: dispatch_after_isobmff_triage
        cases:
          - when: "SELECT 1 FROM isobmff_triage WHERE verdict = 'DROP'"
            goto: quarantine_flow
        default: isobmff_verified_flow

  isobmff_verified_flow:
    steps:
      - task: log_isobmff_triage_pass
        use: sql_rule
        query: |
          SELECT 'STAGE1_ISOBMFF_VERIFIED' AS rule_id,
                 0 AS severity,
                 0 AS file_offset,
                 'isobmff' AS region_tag,
                 CAST(box_count AS REAL) AS measured_value,
                 'Passed ISOBMFF structural triage: ' || box_count || ' boxes, ' || mdat_count || ' mdat (' || total_mdat_bytes || ' bytes)' AS message
          FROM isobmff_triage
        output:
          into: audit_findings

      - task: mp4_probe_and_triage
        use: triage/probe_mp4
        input:
          stream:
            from: file
        params:
          emit_tracks: true
        output:
          schema: triage

      - router: dispatch_after_mp4
        cases:
          - when: "SELECT 1 FROM mp4_triage WHERE verdict = 'DROP'"
            goto: quarantine_flow
        default: ir_lowering_pipeline

  # Stage 1: Dedicated Native MP4 Semantic Triaging Pipeline
  mp4_triage_pipeline:
    steps:
      - task: mp4_probe_and_triage
        use: triage/probe_mp4
        input:
          stream:
            from: file
        params:
          emit_tracks: true
        output:
          schema: triage

      - router: dispatch_after_mp4_triage
        cases:
          - when: "SELECT 1 FROM mp4_triage WHERE verdict = 'DROP'"
            goto: quarantine_flow
        default: mp4_verified_flow

  mp4_verified_flow:
    steps:
      - task: log_mp4_triage_pass
        use: sql_rule
        query: |
          SELECT 'STAGE1_MP4_VERIFIED' AS rule_id,
                 0 AS severity,
                 0 AS file_offset,
                 'mp4' AS region_tag,
                 CAST(track_count AS REAL) AS measured_value,
                 'Passed MP4 triage: ' || track_count || ' tracks (' || video_track_count || ' video, ' || audio_track_count || ' audio), brand=' || major_brand || ', unreferenced slack=' || unreferenced_mdat_slack || ' bytes' AS message
          FROM mp4_triage
        output:
          into: audit_findings

      - router: dispatch_to_ir_from_mp4
        cases: []
        default: ir_lowering_pipeline

  # Stage 1: Dedicated Native EBML Structural Triaging Pipeline
  ebml_triage_pipeline:
    steps:
      - task: ebml_probe_and_expand
        use: triage/probe_ebml
        input:
          stream:
            from: file
        params:
          emit_elements: true
          recurse_clusters: false
        output:
          schema: triage

      - router: dispatch_after_ebml_triage
        cases:
          - when: "SELECT 1 FROM ebml_triage WHERE verdict = 'DROP'"
            goto: quarantine_flow
        default: ebml_verified_flow

  ebml_verified_flow:
    steps:
      - task: log_ebml_triage_pass
        use: sql_rule
        query: |
          SELECT 'STAGE1_EBML_VERIFIED' AS rule_id,
                 0 AS severity,
                 0 AS file_offset,
                 'ebml' AS region_tag,
                 CAST(element_count AS REAL) AS measured_value,
                 'Passed EBML structural triage: ' || element_count || ' elements, doctype=' || doc_type || ' v' || doc_type_version || ', ' || cluster_count || ' clusters (' || total_cluster_bytes || ' bytes)' AS message
          FROM ebml_triage
        output:
          into: audit_findings

      - task: mkv_probe_and_triage
        use: triage/probe_mkv
        input:
          stream:
            from: file
        params:
          emit_tracks: true
        output:
          schema: triage

      - router: dispatch_after_mkv
        cases:
          - when: "SELECT 1 FROM mkv_triage WHERE verdict = 'DROP'"
            goto: quarantine_flow
        default: ir_lowering_pipeline

  # Stage 1: Dedicated Native MKV Semantic Triaging Pipeline
  mkv_triage_pipeline:
    steps:
      - task: mkv_probe_and_triage
        use: triage/probe_mkv
        input:
          stream:
            from: file
        params:
          emit_tracks: true
        output:
          schema: triage

      - router: dispatch_after_mkv_triage
        cases:
          - when: "SELECT 1 FROM mkv_triage WHERE verdict = 'DROP'"
            goto: quarantine_flow
        default: mkv_verified_flow

  mkv_verified_flow:
    steps:
      - task: log_mkv_triage_pass
        use: sql_rule
        query: |
          SELECT 'STAGE1_MKV_VERIFIED' AS rule_id,
                 0 AS severity,
                 0 AS file_offset,
                 'mkv' AS region_tag,
                 CAST(track_count AS REAL) AS measured_value,
                 'Passed MKV triage: ' || track_count || ' tracks (' || video_track_count || ' video, ' || audio_track_count || ' audio), codec=' || primary_video_codec || ', ' || video_width || 'x' || video_height || ', duration=' || ROUND(duration_seconds, 2) || 's' AS message
          FROM mkv_triage
        output:
          into: audit_findings

      - router: dispatch_to_ir_from_mkv
        cases: []
        default: ir_lowering_pipeline

  # Stage 1: Dedicated Native RIFF Structural Triaging Pipeline
  riff_triage_pipeline:
    steps:
      - task: riff_probe_and_expand
        use: triage/probe_riff
        input:
          stream:
            from: file
        params:
          emit_chunks: true
          recurse_movi: false
        output:
          schema: triage

      - router: dispatch_after_riff_triage
        cases:
          - when: "SELECT 1 FROM riff_triage WHERE verdict = 'DROP'"
            goto: quarantine_flow
        default: riff_verified_flow

  riff_verified_flow:
    steps:
      - task: log_riff_triage_pass
        use: sql_rule
        query: |
          SELECT 'STAGE1_RIFF_VERIFIED' AS rule_id,
                 0 AS severity,
                 0 AS file_offset,
                 'riff' AS region_tag,
                 CAST(chunk_count AS REAL) AS measured_value,
                 'Passed RIFF structural triage: ' || chunk_count || ' chunks, form=' || form_type || ', root_size=' || root_size || ', movi=' || movi_bytes || ' bytes' AS message
          FROM riff_triage
        output:
          into: audit_findings

      - router: dispatch_to_ir_from_riff
        cases: []
        default: ir_lowering_pipeline

  # ===========================================================================
  # STAGE 2: Intermediate Representation (IR) Lowering Pipeline
  # ===========================================================================
  ir_lowering_pipeline:
    steps:
      - task: lower_container_to_ir
        use: ir/lower_container
        input:
          stream:
            from: file
          triage:
            table: file_triage
          boxes:
            table: isobmff_boxes
            order_by: header_offset
          elements:
            table: ebml_elements
            order_by: header_offset
          chunks:
            table: riff_chunks
            order_by: header_offset
        output:
          schema: ir_core

      - task: lower_media_to_ir
        use: ir/lower_media
        input:
          stream:
            from: file
          mp4_tracks:
            table: mp4_tracks
          mkv_tracks:
            table: mkv_tracks
        output:
          schema: ir_deep

      - task: detect_region_overflows
        use: sql_rule
        query: |
          SELECT 'IR_REGION_OVERFLOW' AS rule_id,
                 2 AS severity,
                 header_offset AS file_offset,
                 tag_name AS region_tag,
                 CAST(effective_end_offset AS REAL) AS measured_value,
                 'Region ' || tag_name || ' (id=' || region_id || ') overflows file bounds: offset=' || header_offset || ' end=' || effective_end_offset AS message
          FROM ir_regions
          WHERE is_truncated_or_overflow = 1
        output:
          into: audit_findings

      - router: dispatch_after_ir_lowering
        cases:
          - when: "SELECT 1 FROM ir_regions WHERE is_truncated_or_overflow = 1"
            goto: quarantine_flow
        default: ir_verified_flow

  ir_verified_flow:
    steps:
      - task: log_ir_lowered
        use: sql_rule
        query: |
          SELECT 'IR_LOWERED' AS rule_id,
                 0 AS severity,
                 0 AS file_offset,
                 true_magic_name AS region_tag,
                 CAST((SELECT COUNT(*) FROM ir_regions) AS REAL) AS measured_value,
                 'Consolidated IR: ' || (SELECT COUNT(*) FROM ir_regions) || ' regions, file_size=' || file_size || ', highest_root_end=' || highest_root_end AS message,
                 1 AS is_remediated,
                 'VERIFIED' AS remediation_action
          FROM container_metadata
        output:
          into: audit_findings

      - router: dispatch_to_forensics
        cases: []
        default: forensics_analysis_pipeline

  # ===========================================================================
  # STAGE 3: Deep Forensic Analysis & Security Audit Pipeline
  # ===========================================================================
  forensics_analysis_pipeline:
    steps:
      - task: analyze_topology
        use: forensics/analyze_topology
        input:
          stream:
            from: file
          meta:
            table: container_metadata
          regions:
            table: ir_regions
            order_by: header_offset
        output:
          schema: ir_deep

      - task: scan_entropy
        use: forensics/scan_entropy
        input:
          stream:
            from: file
          slack:
            table: ir_unreferenced_slack
        params:
          min_entropy: 7.2
        output:
          into: audit_findings

      - task: check_inconsistencies
        use: forensics/check_inconsistencies
        input:
          stream:
            from: file
          configs:
            table: ir_codec_configs
          extents:
            table: ir_sample_extents
        output:
          into: audit_findings

      - router: dispatch_after_forensics
        cases:
          - when: "SELECT 1 FROM audit_findings WHERE severity >= 2 AND is_remediated = 0"
            goto: forensics_findings_detected
        default: video_verified_clean

  forensics_findings_detected:
    steps:
      - task: log_forensics_summary
        use: sql_rule
        query: |
          SELECT 'FORENSICS_FINDINGS_PENDING' AS rule_id,
                 1 AS severity,
                 0 AS file_offset,
                 'forensics' AS region_tag,
                 CAST((SELECT COUNT(*) FROM audit_findings WHERE severity >= 2 AND is_remediated = 0) AS REAL) AS measured_value,
                 'Forensic scan completed: ' || (SELECT COUNT(*) FROM audit_findings WHERE severity >= 2 AND is_remediated = 0) || ' critical findings pending remediation' AS message,
                 0 AS is_remediated,
                 'PENDING_SANITIZATION' AS remediation_action
        output:
          into: audit_findings

  video_verified_clean:
    steps:
      - task: log_clean_certification
        use: sql_rule
        query: |
          SELECT 'VIDEO_CLEAN_VERIFIED' AS rule_id,
                 0 AS severity,
                 0 AS file_offset,
                 'verified' AS region_tag,
                 0.0 AS measured_value,
                 'Video certified clean: zero critical unresolved findings across all stages' AS message,
                 1 AS is_remediated,
                 'VERIFIED_CLEAN' AS remediation_action
        output:
          into: audit_findings

  unsupported_format_flow:
    steps:
      - task: log_unsupported_format
        use: sql_rule
        query: |
          SELECT 'STAGE1_UNSUPPORTED_FORMAT' AS rule_id,
                 1 AS severity,
                 0 AS file_offset,
                 detected_family AS region_tag,
                 0.0 AS measured_value,
                 'Format family not supported for deep triage: ' || detected_family AS message
          FROM file_triage
        output:
          into: audit_findings

  quarantine_flow:
    steps:
      - task: mark_quarantine_decision
        use: sql_rule
        query: |
          SELECT 'STAGE0_QUARANTINED' AS rule_id,
                 2 AS severity,
                 0 AS file_offset,
                 identified_format AS region_tag,
                 mid_entropy AS measured_value,
                 'File rejected at Stage 0 Triage (' || flags_csv || ')' AS message
          FROM file_triage
        output:
          into: audit_findings
