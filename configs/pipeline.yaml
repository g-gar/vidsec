version: 2

# =============================================================================
# VidSec Video Security & Forensics Pipeline
# Declarative, in-memory, field-routed analytical pipeline configuration.
# Operational logging is handled natively via ExecutionTracer (JSONL),
# while audit_findings in SQLite is strictly reserved for security threats.
# =============================================================================

storages:
  db:
    type: sqlite
    schema: "./configs/schemas.yaml"
    path: "./vidsec_state.db"
  artifacts:
    type: file_store
    directory: "./artifacts/"

modules:
  analyzer:
    path: "./zig-out/lib/libanalyzer.so"

pipelines:
  # ===========================================================================
  # STAGE 0: Pre-Triage Gatekeeper
  # Validates magic bytes, container entropy, and file dimensions.
  # Persists initial triage metadata to SQLite; intermediate buffers remain in RAM.
  # ===========================================================================
  main:
    steps:
      - id: stage0_probe_file
        uses: analyzer/probe_file
        params:
          min_file_size_bytes: 8
          max_file_size_mb: 4096
          min_mid_entropy: 5.5
          strict_extension: true
        outputs:
          into: file_triage
          fields:
            file_size: { into: db }
            identified_format: { into: db }
            mime_type: { into: db }
            true_magic_kind: { into: db }
            true_magic_name: { into: db }
            detected_family: { into: db }
            exceeds_size_limit: { into: db }
            mid_entropy: { into: db }
            zip_eocd_offset: { into: db }
            verdict: { into: db }
            flags_csv: { into: db }

      - router: dispatch_after_triage
        cases:
          - when: "stage0_probe_file.verdict == 'DROP' or stage0_probe_file.true_magic_kind >= 10 or stage0_probe_file.exceeds_size_limit == true"
            goto: quarantine_flow
          - when: "stage0_probe_file.detected_family == 'isobmff'"
            goto: isobmff_triage_pipeline
          - when: "stage0_probe_file.detected_family == 'ebml'"
            goto: ebml_triage_pipeline
          - when: "stage0_probe_file.detected_family == 'riff'"
            goto: riff_triage_pipeline
        default: unsupported_format_flow

  # ===========================================================================
  # STAGE 1: Format-Specific Container Inspection & Semantic Triaging
  # ===========================================================================

  # Stage 1: ISOBMFF Structural Triaging Pipeline
  isobmff_triage_pipeline:
    steps:
      - id: isobmff_probe_and_expand
        uses: analyzer/probe_isobmff
        params:
          emit_boxes: true
          allow_gaps: false
          max_gap_tolerance_bytes: 0
          allow_trailing_data: false
          max_depth: 8
          strict_order: true
        outputs:
          into: isobmff_triage
          fields:
            box_count: { into: db }
            root_box_count: { into: db }
            max_depth: { into: db }
            mdat_count: { into: db }
            total_mdat_bytes: { into: db }
            trailing_slack_bytes: { into: db }
            has_ftyp: { into: db }
            has_moov: { into: db }
            verdict: { into: db }
            flags_csv: { into: db }

      - router: dispatch_after_isobmff_triage
        cases:
          - when: "isobmff_probe_and_expand.verdict == 'DROP'"
            goto: quarantine_flow
        default: mp4_triage_pipeline

  # Stage 1: MP4 Semantic Triaging Pipeline
  mp4_triage_pipeline:
    steps:
      - id: mp4_probe_and_triage
        uses: analyzer/probe_mp4
        inputs:
          file_size: stage0_probe_file.file_size
          isobmff_box_count:
            from: isobmff_probe_and_expand.box_count
            default: 0
        params:
          emit_tracks: true
        outputs:
          into: mp4_triage
          fields:
            track_count: { into: db }
            video_track_count: { into: db }
            audio_track_count: { into: db }
            major_brand: { into: db }
            video_codec: { into: db }
            video_width: { into: db }
            video_height: { into: db }
            total_samples: { into: db }
            total_sample_bytes: { into: db }
            unreferenced_mdat_slack: { into: db }
            verdict: { into: db }
            flags_csv: { into: db }

      - router: dispatch_after_mp4_triage
        cases:
          - when: "mp4_probe_and_triage.verdict == 'DROP'"
            goto: quarantine_flow
        default: mp4_lowering_pipeline

  # Stage 2: Declarative ISOBMFF / MP4 Lowering Pipeline
  mp4_lowering_pipeline:
    steps:
      - id: lower_container_to_ir
        uses: analyzer/lower_isobmff_container
        input:
          boxes:
            table: isobmff_boxes
        inputs:
          file_size: stage0_probe_file.file_size
          true_magic_kind: stage0_probe_file.true_magic_kind
          true_magic_name: stage0_probe_file.true_magic_name
        outputs:
          into: [container_metadata, ir_regions, audit_findings]

      - id: lower_media_to_ir
        uses: analyzer/lower_mp4_media
        input:
          tracks:
            table: mp4_tracks
        outputs:
          target: memory

      - router: dispatch_after_mp4_lowering
        cases:
          - when: "SELECT 1 FROM audit_findings WHERE rule_id = 'IR_REGION_OVERFLOW' OR severity >= 2"
            goto: quarantine_flow
        default: forensics_analysis_pipeline

  # Stage 1: EBML Structural Triaging Pipeline
  ebml_triage_pipeline:
    steps:
      - id: ebml_probe_and_expand
        uses: analyzer/probe_ebml
        params:
          emit_elements: true
          recurse_clusters: false
        outputs:
          into: ebml_triage
          fields:
            element_count: { into: db }
            doc_type: { into: db }
            doc_type_version: { into: db }
            has_ebml_header: { into: db }
            has_segment: { into: db }
            cluster_count: { into: db }
            total_cluster_bytes: { into: db }
            trailing_slack_bytes: { into: db }
            verdict: { into: db }
            flags_csv: { into: db }

      - router: dispatch_after_ebml_triage
        cases:
          - when: "ebml_probe_and_expand.verdict == 'DROP'"
            goto: quarantine_flow
        default: mkv_triage_pipeline

  # Stage 1: MKV Semantic Triaging Pipeline
  mkv_triage_pipeline:
    steps:
      - id: mkv_probe_and_triage
        uses: analyzer/probe_mkv
        inputs:
          file_size: stage0_probe_file.file_size
        params:
          emit_tracks: true
        outputs:
          into: mkv_triage
          fields:
            track_count: { into: db }
            video_track_count: { into: db }
            audio_track_count: { into: db }
            video_codec_id: { into: db }
            video_width: { into: db }
            video_height: { into: db }
            duration_seconds: { into: db }
            cluster_count: { into: db }
            unreferenced_cluster_slack: { into: db }
            verdict: { into: db }
            flags_csv: { into: db }

      - router: dispatch_after_mkv_triage
        cases:
          - when: "mkv_probe_and_triage.verdict == 'DROP'"
            goto: quarantine_flow
        default: mkv_lowering_pipeline

  # Stage 2: Declarative EBML / MKV Lowering Pipeline
  mkv_lowering_pipeline:
    steps:
      - id: lower_container_to_ir
        uses: analyzer/lower_ebml_container
        input:
          elements:
            table: ebml_elements
        inputs:
          file_size: stage0_probe_file.file_size
          true_magic_kind: stage0_probe_file.true_magic_kind
          true_magic_name: stage0_probe_file.true_magic_name
        outputs:
          into: [container_metadata, ir_regions, audit_findings]

      - id: lower_media_to_ir
        uses: analyzer/lower_mkv_media
        input:
          tracks:
            table: mkv_tracks
        outputs:
          target: memory

      - router: dispatch_after_mkv_lowering
        cases:
          - when: "SELECT 1 FROM audit_findings WHERE rule_id = 'IR_REGION_OVERFLOW' OR severity >= 2"
            goto: quarantine_flow
        default: forensics_analysis_pipeline

  # Stage 1: RIFF Structural Triaging Pipeline
  riff_triage_pipeline:
    steps:
      - id: riff_probe_and_expand
        uses: analyzer/probe_riff
        params:
          emit_chunks: true
          recurse_movi: false
        outputs:
          into: riff_triage
          fields:
            chunk_count: { into: db }
            form_type: { into: db }
            root_size: { into: db }
            movi_bytes: { into: db }
            junk_bytes: { into: db }
            trailing_slack_bytes: { into: db }
            verdict: { into: db }
            flags_csv: { into: db }

      - router: dispatch_after_riff_triage
        cases:
          - when: "riff_probe_and_expand.verdict == 'DROP'"
            goto: quarantine_flow
        default: riff_lowering_pipeline

  # Stage 2: Declarative RIFF Lowering Pipeline
  riff_lowering_pipeline:
    steps:
      - id: lower_container_to_ir
        uses: analyzer/lower_riff_container
        input:
          chunks:
            table: riff_chunks
        inputs:
          file_size: stage0_probe_file.file_size
          true_magic_kind: stage0_probe_file.true_magic_kind
          true_magic_name: stage0_probe_file.true_magic_name
        outputs:
          into: [container_metadata, ir_regions, audit_findings]

      - router: dispatch_after_riff_lowering
        cases:
          - when: "SELECT 1 FROM audit_findings WHERE rule_id = 'IR_REGION_OVERFLOW' OR severity >= 2"
            goto: quarantine_flow
        default: forensics_analysis_pipeline

  # ===========================================================================
  # STAGE 3: Deep Forensic Analysis & Security Audit Pipeline
  # Reads topology, entropy, and codec structures from memory and registers findings.
  # ===========================================================================
  forensics_analysis_pipeline:
    steps:
      - id: analyze_topology
        uses: analyzer/analyze_topology
        input:
          regions:
            table: ir_regions
        inputs:
          file_size: stage0_probe_file.file_size
          highest_root_end: lower_container_to_ir.highest_root_end
          prev_verdict: db.file_triage.verdict
        params:
          allow_trailing_slack: false
          max_trailing_slack_bytes: 0
        outputs:
          into: audit_findings

      - id: scan_entropy
        uses: analyzer/scan_entropy
        input:
          slack:
            table: ir_unreferenced_slack
        inputs:
          file_size: stage0_probe_file.file_size
        params:
          min_entropy: 7.2
        outputs:
          into: audit_findings

      - id: check_inconsistencies
        uses: analyzer/check_inconsistencies
        input:
          configs:
            table: ir_codec_configs
          extents:
            table: ir_sample_extents
        outputs:
          into: audit_findings

      - router: dispatch_after_forensics
        cases:
          - when: "SELECT 1 FROM audit_findings WHERE severity >= 2"
            goto: forensics_findings_detected
        default: video_verified_clean

  # ===========================================================================
  # Final Terminal Flows
  # ===========================================================================
  forensics_findings_detected:
    steps: []

  video_verified_clean:
    steps: []

  unsupported_format_flow:
    steps:
      - id: log_unsupported_format
        uses: sql_rule
        query: |
          SELECT 'STAGE1_UNSUPPORTED_FORMAT' AS rule_id,
                 1 AS severity,
                 0 AS file_offset,
                 detected_family AS region_tag,
                 0.0 AS measured_value,
                 'Format family not supported for deep triage: ' || detected_family AS message
          FROM file_triage
        outputs:
          into: audit_findings

  quarantine_flow:
    steps:
      - id: mark_quarantine_decision
        uses: sql_rule
        query: |
          SELECT 'STAGE0_QUARANTINED' AS rule_id,
                 2 AS severity,
                 0 AS file_offset,
                 identified_format AS region_tag,
                 mid_entropy AS measured_value,
                 'File rejected at Stage 0 Triage (' || flags_csv || ')' AS message
          FROM file_triage
        outputs:
          into: audit_findings
