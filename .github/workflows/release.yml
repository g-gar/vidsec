name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from build.zig.zon
        id: ver
        run: |
          ZON_VER="$(grep '\.version' build.zig.zon | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "version=v${ZON_VER}" >> "$GITHUB_OUTPUT"
          echo "Release version: v${ZON_VER}"

  build-and-package:
    name: Build ${{ matrix.name }}
    needs: resolve-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-linux-gnu
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-linux-gnu
          - name: macos-aarch64
            os: macos-14
            target: aarch64-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Run test suite
        run: zig build test --summary all

      - name: Build ReleaseSafe
        run: zig build -Doptimize=ReleaseSafe --summary all

      - name: Package release artifact
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          PKG_NAME="vidsec-${VERSION}-${{ matrix.name }}"
          mkdir -p "dist/${PKG_NAME}/bin" "dist/${PKG_NAME}/lib" "dist/${PKG_NAME}/configs"
          
          # Copy binaries and shared libraries
          cp zig-out/bin/* "dist/${PKG_NAME}/bin/"
          cp -P zig-out/lib/* "dist/${PKG_NAME}/lib/"
          
          # Copy pipeline configurations and docs
          cp configs/pipeline.yaml configs/schemas.yaml "dist/${PKG_NAME}/configs/"
          [ -f README.md ] && cp README.md "dist/${PKG_NAME}/"
          
          # Compress artifact
          cd dist
          tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          else
            shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidsec-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish-release:
    name: Publish GitHub Release
    needs: [resolve-version, build-and-package]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate consolidated SHA256SUMS
        run: |
          cd release-artifacts
          cat *.sha256 > SHA256SUMS.txt || true
          ls -la

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.version }}
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
